<title>Cloud Kitchen | Order online</title>
<meta name="description" content="Order momo, chowmein, tea and coffee online from Cloud Kitchen. Delivery or pickup, cash on delivery or pay online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* from the Cloud Kitchen logo: black, logo red, white */
    --sky:#151515; --sky-2:#000000; --cloud:#FAFAF9; --mist:#EFEFEC; --line:#E2E2DE;
    --gold:#E3141B; --gold-hi:#F5262D; --steam:#6B6B6B; --ok:#2E8B57; --err:#C0151B;
    --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
    --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }
  body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;color:var(--sky);background:var(--cloud);-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit}

  /* branded loading screen (shows instantly, before any script runs) */
  .splash{position:fixed;inset:0;z-index:200;background:#000;color:#bdbdbd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .35s ease;padding:24px;text-align:center}
  .splash img{border-radius:50%;animation:ckpulse 1.6s ease-in-out infinite}
  .splash .bar{width:170px;height:4px;border-radius:4px;background:#262626;overflow:hidden}
  .splash .bar i{display:block;width:40%;height:100%;background:#E3141B;border-radius:4px;animation:ckbar 1.1s ease-in-out infinite}
  .splash p{margin:0;font-size:15px}
  .splash .err{color:#fff;max-width:440px;line-height:1.55;font-size:15px}
  .splash .err b{display:block;font-size:19px;margin-bottom:6px}
  .splash button{margin-top:6px;border:0;border-radius:12px;padding:12px 20px;background:#E3141B;color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
  .splash.out{opacity:0;pointer-events:none}
  @keyframes ckpulse{50%{transform:scale(1.06)}}
  @keyframes ckbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.splash img,.splash .bar i{animation:none}}
  :focus-visible{outline:3px solid #FF7A7F;outline-offset:2px;border-radius:6px}
  .ic{display:inline-block;vertical-align:-.18em;flex:none}
  .hidden{display:none!important}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 75% 40%,#1E1E1E 0%,#000 62%);isolation:isolate}
  .hero .bar{display:flex;align-items:center;gap:12px;padding:18px 0}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-decoration:none}
  .brand img{width:40px;height:40px;display:block}
  .spacer{flex:1}
  .cartbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;background:var(--gold);color:#fff;font-weight:700}
  .cartbtn .n{background:#fff;color:var(--gold);border-radius:999px;min-width:24px;padding:0 7px;font-size:13px;line-height:22px;text-align:center}
  @media (max-width:520px){ .cartbtn .lbl{display:none} .cartbtn{padding:10px 14px} }
  .navbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:9px 14px;background:transparent;color:#fff;font-weight:600}
  .navbtn:hover{background:rgba(255,255,255,.08)}
  @media (max-width:520px){ .navbtn .lbl{display:none} .navbtn{padding:9px 11px} }
  .hist{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .hist .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hist .when{color:var(--steam);font-size:14px}
  .hist .its{margin:8px 0 10px;font-size:15px}
  .hist .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .hist .acts{display:flex;gap:8px}
  .chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--mist);color:var(--sky)}
  .chip.new,.chip.processing,.chip.ready{background:#FFF1D6;color:#9A6400} .chip.delivered{background:#E3F3EA;color:var(--ok)} .chip.cancelled{background:#eee;color:#888}
  .smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--sky)}

  .hero .inner{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding:48px 0 130px}

  .mountains{position:absolute;left:0;right:0;bottom:-1px;z-index:1;width:100%;height:clamp(70px,11vw,140px);display:block;color:var(--cloud)}
  .hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.7rem,7.6vw,5.9rem);line-height:.94;letter-spacing:-.035em;margin:0 0 22px;max-width:12ch;text-wrap:balance}
  .hero p.lead{font-size:clamp(1.05rem,2.2vw,1.25rem);color:#D9E0EE;max-width:46ch;margin:0 0 28px}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 32px;padding:0;list-style:none}
  .facts li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:999px;font-size:15px;color:#E9EEF7}

  .cta{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:16px 26px;background:var(--gold);color:#fff;font-weight:700;font-size:17px;text-decoration:none;box-shadow:0 12px 32px -12px rgba(227,20,27,.8)}

  .closed{display:inline-flex;align-items:center;gap:10px;background:rgba(227,20,27,.16);border:1px solid rgba(255,90,95,.45);color:#FFD6D7;padding:12px 16px;border-radius:14px;margin-bottom:22px;font-weight:600}
  /* rising steam: the one ambient animation */
  .steam{position:absolute;inset:0;z-index:1;pointer-events:none}

  @keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.5}70%{opacity:.28}100%{transform:translate(var(--dx,40px),-120vh) scale(1.6);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .puff{opacity:.18;bottom:auto;top:var(--top,30%)} }

  /* ---------- sticky top bar (always visible, holds the order button) ---------- */
  .nav{position:sticky;top:0;z-index:35;background:rgba(0,0,0,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
  .nav .wrap{display:flex;align-items:center;gap:12px;height:64px}
  /* hero photo collage around the logo */
  .collage{position:relative;justify-self:end;width:min(520px,100%);aspect-ratio:1/1}
  .collage .p{position:absolute;overflow:hidden;border-radius:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8);border:4px solid #fff;background:#222}
  .collage .p img{width:100%;height:100%;object-fit:cover;display:block}
  .collage .p1{inset:0 22% 26% 0;transform:rotate(-3deg)}
  .collage .p2{width:46%;aspect-ratio:1/1;right:0;top:10%;transform:rotate(5deg)}
  .collage .p3{width:42%;aspect-ratio:1/1;right:6%;bottom:0;transform:rotate(-4deg)}
  .collage .badge{position:absolute;left:-4%;bottom:-2%;width:40%;aspect-ratio:1/1;filter:drop-shadow(0 18px 40px rgba(227,20,27,.45))}
  .collage .badge img{width:100%;height:100%;display:block}
  @media (max-width:820px){ .collage{justify-self:center;width:min(360px,92%);margin:6px 0 10px} }

  /* category photo tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:30px 0 6px}
  .tile{position:relative;aspect-ratio:4/3;border-radius:20px;overflow:hidden;border:0;padding:0;background:#222;color:#fff;text-align:left;cursor:pointer}

  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
  .tile span{position:absolute;left:16px;bottom:12px;z-index:1;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
  .tile small{display:block;font-family:var(--body);font-weight:600;font-size:13px;opacity:.8;letter-spacing:0}
  @media (max-width:560px){ .tiles{grid-template-columns:1fr 1fr;gap:10px} .tile span{font-size:18px} }

  /* menu + fixed order panel on the right */
  .shop{display:block}

    .shop{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:36px;align-items:start}

    .side{display:flex;flex-direction:column;position:sticky;top:150px;max-height:calc(100vh - 170px);margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 50px -30px rgba(0,0,0,.35);overflow:hidden}
    /* below the menu, the order stays reachable as a floating button bottom-right */

    body .floatbar.show{display:block}
  }
  .side .sh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--mist)}

  .side .sh .n{background:var(--gold);color:#fff;border-radius:999px;min-width:26px;text-align:center;font-weight:700;font-size:14px;line-height:26px;padding:0 8px}

  .side .emptyc{text-align:center;color:var(--steam);padding:34px 10px}
  .side .emptyc .ic{color:var(--line);margin-bottom:6px}

  /* nav links */
  .navlinks{display:flex;gap:4px;margin-left:18px}

  .navlinks a:hover{color:#fff;background:rgba(255,255,255,.08)}
  @media (max-width:900px){ .navlinks{display:none} }

  /* why-us strip */
  .why{background:#fff;border-bottom:1px solid var(--line)}

  .why .it{display:flex;gap:14px;align-items:flex-start;padding:26px 22px 26px 0}

  @media (max-width:900px){ .why .wrap{grid-template-columns:1fr 1fr} .why .it:nth-child(3){padding-left:0;border-left:0} .why .it{padding:18px 12px 18px 0} .why .it + .it{padding-left:12px} }
  @media (max-width:520px){ .why .wrap{grid-template-columns:1fr} .why .it,.why .it + .it{padding:14px 0;border-left:0;border-top:1px solid var(--line)} .why .it:first-child{border-top:0} }

  /* big quote over a photo */
  .quote{position:relative;margin-top:72px;color:#fff;overflow:hidden;isolation:isolate;background:#000}
  .quote > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.55}
  .quote::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 60%,rgba(0,0,0,.25) 100%)}

  .quote blockquote{margin:0;max-width:16ch;font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1;letter-spacing:-.035em}
  .quote blockquote::before{content:"\201C";display:block;color:var(--gold);font-size:1.6em;line-height:.6;margin-bottom:10px}
  .quote p{color:#CFCFCF;font-size:18px;margin:22px 0 28px;max-width:44ch}

  /* about */
  .about{padding:96px 0 40px}
  .about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
  .stack{position:relative;aspect-ratio:5/4.6}
  .stack .a{position:absolute;inset:0 18% 14% 0;border-radius:28px;overflow:hidden;background:var(--mist)}
  .stack .b{position:absolute;width:48%;aspect-ratio:1/1;right:0;bottom:0;border-radius:24px;overflow:hidden;border:6px solid var(--cloud);background:var(--mist)}
  .stack img{width:100%;height:100%;object-fit:cover;display:block}
  .stack .tag{position:absolute;left:18px;top:18px;background:var(--gold);color:#fff;font-weight:700;border-radius:999px;padding:8px 14px;display:flex;gap:8px;align-items:center;font-size:14px}
  .about h2,.how h2,.visit h2,.gallery h2{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 18px}
  .about p{color:#444;font-size:17px;line-height:1.65;margin:0 0 16px;max-width:52ch}
  .ticks{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
  .ticks li{display:flex;gap:10px;align-items:center;font-weight:600}
  .ticks .ic{color:#fff;background:var(--gold);border-radius:50%;padding:3px;width:22px;height:22px}
  @media (max-width:860px){ .about .wrap{grid-template-columns:1fr;gap:36px} .about{padding:64px 0 20px} }

  /* how to order */
  .how{padding:80px 0}

  .steps4{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:0;counter-reset:s}
  .steps4 li{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
  .steps4 li:last-child{border-bottom:1px solid var(--line)}
  .steps4 li::before{counter-increment:s;content:counter(s);width:44px;height:44px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px}
  .steps4 b{display:block;font-size:18px;margin-top:2px}

  @media (max-width:860px){ .how .wrap{grid-template-columns:1fr;gap:30px} .how .pic{aspect-ratio:16/10} }

  .gallery{padding:20px 0 80px}

  @media (max-width:760px){ .ggrid{grid-template-columns:1fr 1fr;grid-auto-rows:150px} }

  /* visit */

  .btnl{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.22);color:#fff}

  /* final call to action */

  .cta2 h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.8rem);letter-spacing:-.03em;margin:0;line-height:1}
  .cta2 p{margin:8px 0 0;color:#FFE3E4}
  .cta2 a{background:#000;color:#fff;border-radius:16px;padding:16px 26px;font-weight:700;text-decoration:none;display:inline-flex;gap:10px;align-items:center}
  .cta2 a:hover{background:#222}
  footer{margin-top:0}

  /* ---------- your orders strip ---------- */
  .mine{display:flex;gap:12px;overflow-x:auto;padding:18px 0 4px}
  .mine button{flex:none;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .mine b{font-weight:700}
  .dotst{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
  .dotst.delivered{background:var(--ok)} .dotst.cancelled{background:#aaa}

  /* ---------- menu ---------- */
  .menubar{position:sticky;top:64px;z-index:20;background:rgba(250,250,249,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .menubar .wrap{display:flex;gap:12px;align-items:center;padding-top:12px;padding-bottom:12px}
  .search{position:relative;flex:0 1 280px}
  .search input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:15px}

  .section{padding:40px 0 8px;scroll-margin-top:150px}

  .section h2{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,3.6vw,2.4rem);letter-spacing:-.025em;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:28px 22px}
  @media (max-width:560px){ .grid{grid-template-columns:1fr 1fr;gap:22px 14px} }
  .dish{display:flex;flex-direction:column}
  /* each category is one sideways row */

  .sechead .cnt{color:var(--steam);font-weight:600;font-size:14px}
  .arrows{display:flex;gap:8px}
  .arr{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--sky);display:grid;place-items:center;box-shadow:0 6px 16px -10px rgba(0,0,0,.4)}
  .arr:hover:not(:disabled){border-color:var(--sky)}
  .arr:disabled{opacity:.35;cursor:default;box-shadow:none}
  .arr[data-dir="-1"] .ic{transform:rotate(180deg)}
  .noscroll .arrows{visibility:hidden}
  .hrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,228px);gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-left:2px;padding:4px 2px 18px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 48px),transparent);cursor:grab}
  .hrow::-webkit-scrollbar{display:none}
  .hrow > .dish{scroll-snap-align:start}

  .hrow.at-end{-webkit-mask-image:none;mask-image:none}
  @media (max-width:700px){ .arrows{display:none} .hrow{grid-auto-columns:44vw;gap:14px} }
  .ph{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--mist)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .dish:hover .ph img{transform:scale(1.05)}
  .ph{box-shadow:0 14px 30px -22px rgba(0,0,0,.6)}
  .ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,5rem);color:rgba(227,20,27,.22);letter-spacing:-.04em;background:radial-gradient(circle at 30% 25%,#fff 0%,var(--mist) 70%)}
  .ph .qtyon{position:absolute;left:12px;top:12px;background:var(--sky);color:#fff;font-weight:700;border-radius:999px;padding:2px 10px;font-size:14px}

  .orow .stepper button{width:30px;height:30px}
  .line .nm .sz{display:inline-block;white-space:nowrap;font-weight:600;color:var(--steam)}
  .add{width:42px;height:42px;border-radius:50%;border:0;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}

  /* placeholder cards while the menu loads */

  footer{margin-top:72px;background:#000;color:#D9E0EE;padding:44px 0 calc(44px + env(safe-area-inset-bottom))}

  /* floating order bar (phones) */
  .floatbar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:none}
  .floatbar button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:18px;padding:16px 20px;background:var(--sky);color:#fff;font-weight:700;font-size:16px;box-shadow:0 14px 34px -12px rgba(0,0,0,.6)}
  .floatbar b{color:#FF4148}
  @media (max-width:760px){ .floatbar.show{display:block} }

  /* ---------- drawer (cart + checkout) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 50px -20px rgba(0,0,0,.35)}
  .drawer.open{transform:none}
  @media (max-width:760px){
    .drawer{top:auto;left:0;width:100%;max-height:92vh;border-radius:24px 24px 0 0;transform:translateY(100%)}
    .drawer.open{transform:none}
  }
  .dhead{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--mist)}
  .dhead h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0;flex:1}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--cloud);display:grid;place-items:center;color:var(--sky)}
  .dbody{flex:1;overflow:auto;padding:16px 20px}
  .dfoot{padding:16px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--mist);background:#fff}
  .steps{display:flex;gap:18px;font-size:14px;color:var(--steam);margin-bottom:16px}
  .steps span{display:flex;align-items:center;gap:7px}
  .steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--mist);font-weight:700;font-size:12px}
  .steps .on{color:var(--sky);font-weight:600} .steps .on i{background:var(--sky);color:#fff}
  .line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--mist)}
  .line .th{width:54px;height:54px;border-radius:12px;overflow:hidden;background:var(--mist);flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:rgba(227,20,27,.3);font-size:22px}
  .line .th img{width:100%;height:100%;object-fit:cover}
  .line .nm{flex:1;min-width:0}
  .line .nm b{display:block;font-weight:600;line-height:1.3}
  .line .nm small{color:var(--steam)}
  .line .stepper{background:var(--mist);color:var(--sky)}
  .line .stepper button{color:var(--sky);width:30px;height:30px}
  .totals{margin:14px 0 4px}
  .totals div{display:flex;justify-content:space-between;padding:4px 0;color:var(--steam)}
  .totals .grand{color:var(--sky);font-weight:800;font-size:19px;padding-top:8px}
  .bigbtn{width:100%;border:0;border-radius:16px;padding:16px;background:var(--gold);color:#fff;font-weight:700;font-size:17px;display:flex;justify-content:center;align-items:center;gap:10px}
  .bigbtn:hover{background:var(--gold-hi)}
  .bigbtn:disabled{opacity:.55;cursor:default}
  .bigbtn.dark{background:var(--sky);color:#fff}
  .linkbtn{border:0;background:none;color:var(--steam);font-weight:600;padding:10px;width:100%;margin-top:4px}
  .field{margin-bottom:14px}
  .field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;outline:none;font-size:16px}
  .field input:focus,.field textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--mist)}
  .seg{display:flex;background:var(--cloud);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;border-radius:11px;padding:11px;background:transparent;font-weight:600;color:var(--steam);display:flex;align-items:center;justify-content:center;gap:8px}
  .seg button.on{background:#fff;color:var(--sky);box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
  .areas{display:flex;flex-wrap:wrap;gap:8px}
  .areas button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;color:var(--sky)}
  .areas button .ic{color:var(--steam)}
  .areas button.on{border-color:var(--gold);background:#FFF1F1;color:var(--gold)}
  .areas button.on .ic{color:var(--gold)}
  .pay{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;background:#fff;width:100%;text-align:left}
  .pay.on{border-color:var(--sky);background:#F8FAFE}
  .pay .ic{margin-top:2px;color:var(--sky)}
  .pay b{display:block}
  .pay small{color:var(--steam)}
  .paybox{background:var(--cloud);border-radius:16px;padding:16px;margin:4px 0 14px}
  .paybox .qr{display:block;width:100%;max-width:240px;margin:0 auto 12px;border-radius:12px;background:#fff}
  .paybox dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px}
  .paybox dt{color:var(--steam)} .paybox dd{margin:0;font-weight:600;word-break:break-all}
  .copy{border:0;background:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;margin-left:6px;color:var(--sky)}
  .amount{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;text-align:center;margin:4px 0 2px}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:6px 0 4px}
  .check input{width:20px;height:20px;margin-top:2px;accent-color:var(--sky)}
  .err{color:var(--err);font-weight:600;min-height:22px;font-size:15px;margin:6px 0}
  .done{text-align:center;padding:10px 0}
  .done .big{width:76px;height:76px;border-radius:50%;background:#E3F3EA;color:var(--ok);display:grid;place-items:center;margin:8px auto 14px}
  .done h3{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
  .done p{color:var(--steam);margin:0 0 16px}
  .wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:16px;padding:15px;background:#1FA855;color:#fff;font-weight:700;text-decoration:none;font-size:16px;margin-bottom:10px}
  .track{display:flex;margin:18px 0 6px;text-align:center}
  .track div{flex:1;font-size:13px;color:var(--steam);position:relative}
  .track div::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--mist);z-index:0}
  .track div:first-child::before{display:none}
  .track i{position:relative;z-index:1;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;background:var(--mist);font-style:normal;font-weight:700;font-size:12px}
  .track .on{color:var(--sky);font-weight:600}
  .track .on i{background:var(--ok);color:#fff}
  .track .on::before{background:var(--ok)}
  .summary{background:var(--cloud);border-radius:14px;padding:12px 14px;text-align:left;font-size:15px;margin-top:14px}

  #toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
  .toast{background:var(--sky);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-weight:600;animation:tin .25s ease}
  .toast.alert{background:var(--err)}
  @keyframes tin{from{transform:translateY(-8px);opacity:0}}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login{background:#fff;border-radius:20px;padding:28px;max-width:380px}
  .muted{color:var(--steam)}
</style>
</head>

(function () {
  var app = document.getElementById('app');

})();

const watching = {};
let step = 'cart', form = {}; // checkout state
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
cart = load(CART_KEY, {});
form = { orderType: 'delivery', pay: 'cod', area: '', ...load(INFO_KEY, {}) };

const fee = () => form.orderType === 'delivery' ? (Number(shop.deliveryFee) || 0) : 0;
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const subtotal = () => cartLines(items, cart).reduce((s, l) => s + l.price * l.n, 0);
const isOpen = () => shop.enabled === true;
const cats = () => [...new Set(items.map(i => i.category))];
const initial = n => String(n || '?').trim().charAt(0).toUpperCase();

let shopLoaded = false, menuLoaded = false;
async function init() {
  if (!CONFIGURED) return showSetupNeeded($('#app'));
  // Show the website straight away with default text; real data fills in as it arrives
  settings = { ...DEFAULT_SETTINGS };
  shop = { address: DEFAULT_ADDRESS, hours: DEFAULT_HOURS };
  render();
  db.ref('settings').on('value', s => {
    const next = { ...DEFAULT_SETTINGS, ...(s.val() || {}) };
    const changed = next.cafeName !== settings.cafeName || next.currency !== settings.currency || next.tagline !== settings.tagline;
    settings = next; CURRENCY = settings.currency || 'Rs.';
    document.title = `${settings.cafeName} | Order online`;
    if (changed) render();
  }, () => {});
  // If the menu still hasn't arrived after 12 s, explain instead of showing placeholders forever
  setTimeout(() => { if (!menuLoaded) renderMenu(); }, 12000);
  db.ref('online').on('value', s => {
    shopLoaded = true;
    shop = s.val() || {};
    shop.address = shop.address || DEFAULT_ADDRESS; shop.hours = shop.hours || DEFAULT_HOURS;
    if (!shop.allowDelivery && shop.allowPickup) form.orderType = 'pickup';
    if (!shop.allowPickup && shop.allowDelivery) form.orderType = 'delivery';
    if (form.pay === 'online' && !shop.payOnline) form.pay = 'cod';
    if (form.pay === 'cod' && !shop.cod && shop.payOnline) form.pay = 'online';
    render();
  });
  db.ref('menu').on('value', snap => {
    menuLoaded = true;
    items = listOf(snap.val()).filter(i => i.available).map(i => ({ ...i, price: Number(i.price) || 0 }))
      .sort((a, b) => String(a.category).localeCompare(b.category) || (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0) || String(a.name).localeCompare(b.name));
    let changed = false;
    for (const k in cart) if (!cartPick(items, k)) { delete cart[k]; changed = true; }
    if (changed) save(CART_KEY, cart);
    renderMenu(); renderCartBits(); refreshCollage();
    if ($('#drawer')?.classList.contains('open') && step === 'cart') renderDrawer();
  });
  load(KEY, []).forEach(id => { if (!history().some(h => h.id === id)) addHistory(id); watchOrder(id); });
}

function render() {
  const facts = [
    shop.hours && `<li>${ic('clock', 17)}${esc(shop.hours)}</li>`,
    shop.allowDelivery && `<li>${ic('truck', 17)}${Number(shop.deliveryFee) ? 'Delivery ' + money(shop.deliveryFee) : 'Free delivery'}</li>`,
    shop.allowPickup && `<li>${ic('store', 17)}Pickup available</li>`,
    (shop.cod || shop.payOnline) && `<li>${ic('cash', 17)}${[shop.cod && 'Cash on delivery', shop.payOnline && 'Pay online'].filter(Boolean).join(' or ')}</li>`,
  ].filter(Boolean).join('');

const photoTile = it => dishImg(it, '', 640) || `<div class="ini">${esc(initial(it.name))}</div>`;

function renderMenu() {

  if (q) {
    const shown = items.filter(it => matches(q, it.name, it.description, it.category));
    box.innerHTML = shown.length
      ? `<section class="section"><h2>Results for “${esc(q)}”</h2><div class="grid">${shown.map(dishHtml).join('')}</div></section>`

  } else {

    $('#cats').innerHTML = cs.map((c, i) => `<button data-c="${i}" class="${i ? '' : 'on'}">${esc(c)}</button>`).join('');
    $('#cats').onclick = e => {

    };

    }).join('')
      : `<div class="empty">${ic('book', 44)}<p>The menu is being updated. Please check back soon.</p></div>`;

    if (!add && !dec) return;
    changeQty((add || dec).dataset[add ? 'add' : 'dec'], add ? 1 : -1);
  };
}
// sideways rows: arrows, mouse drag, and arrow buttons that dim at the ends
function setupRows(root) {
  root.querySelectorAll('.hrow').forEach(row => {
    const sec = row.closest('.section');
    const upd = () => {
      const max = row.scrollWidth - row.clientWidth - 2;
      sec.querySelectorAll('.arr').forEach(b => b.disabled = b.dataset.dir === '-1' ? row.scrollLeft <= 2 : row.scrollLeft >= max);
      sec.classList.toggle('noscroll', max <= 0);
      row.classList.toggle('at-end', row.scrollLeft >= max);
    };
    row.addEventListener('scroll', upd, { passive: true });
    setTimeout(upd, 50); window.addEventListener('resize', upd);
    // drag with the mouse on computers (touch already swipes)
    let down = false, startX = 0, startL = 0, moved = false;
    row.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; startX = e.clientX; startL = row.scrollLeft; });
    window.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - startX; if (Math.abs(dx) > 6) { moved = true; row.classList.add('dragging'); row.scrollLeft = startL - dx; } });
    window.addEventListener('pointerup', () => { if (!down) return; down = false; setTimeout(() => row.classList.remove('dragging'), 0); });
    row.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  });
  root.querySelectorAll('.arr').forEach(b => b.onclick = () => {
    const row = document.getElementById('row' + b.dataset.row);
    row.scrollBy({ left: Number(b.dataset.dir) * Math.max(240, row.clientWidth * 0.8), behavior: 'smooth' });
  });
}
function changeQty(id, d) {
  if (d > 0 && !isOpen()) return toast('Online ordering is paused right now.', 'alert');
  cart[id] = Math.max(0, Math.min(50, (cart[id] || 0) + d));
  if (!cart[id]) delete cart[id];
  save(CART_KEY, cart);
  const did = id.split('~')[0];
  document.querySelectorAll(`.dish[data-id="${CSS.escape(did)}"]`).forEach(card => { const it = items.find(i => i.id === did); if (it) card.outerHTML = dishHtml(it); });
  fillPhotos($('#dishes'));
  renderCartBits();
  if (d > 0) { const b = $('#cartTop'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}

let sideVisible = false, sideObs = null;
const isWide = () => window.matchMedia('(min-width:1100px)').matches;
function renderCartBits() {
  if (!$('#cartN')) return;
  renderSide();
  const n = count();
  $('#cartN').textContent = n;
  if (!sideObs && 'IntersectionObserver' in window && $('#side')) {
    sideObs = new IntersectionObserver(es => { sideVisible = es[0].isIntersecting; renderCartBits(); }, { threshold: 0.15 });

  $('#floatbar').classList.toggle('show', n > 0 && !$('#drawer').classList.contains('open') && !(isWide() && sideVisible));

const stepsBar = n => `<div class="steps"><span class="${n === 1 ? 'on' : ''}"><i>1</i>Your details</span><span class="${n === 2 ? 'on' : ''}"><i>2</i>Payment</span></div>`;
const totalsHtml = (withFee = true) => `
  <div class="totals">
    <div><span>Food</span><span>${money(subtotal())}</span></div>
    ${withFee && form.orderType === 'delivery' ? `<div><span>Delivery</span><span>${fee() ? money(fee()) : 'Free'}</span></div>` : ''}
    <div class="grand"><span>Total</span><span>${money(subtotal() + (withFee ? fee() : 0))}</span></div>
  </div>`;

function renderDrawer() {
  const d = $('#drawer'); if (!d) return;
  const head = (title, back) => `<div class="dhead">${back ? `<button class="iconbtn" data-go="${back}" aria-label="Back"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>` : ''}<h2>${title}</h2><button class="iconbtn" id="dclose" aria-label="Close">${ic('x', 18)}</button></div>`;
  const lines = cartLines(items, cart);

  if (step === 'cart') {
    d.innerHTML = head('Your order') + (lines.length ? `
      <div class="dbody">
        ${lines.map(({ it, key, size, price, n }) => `
          <div class="line">
            <div class="th">${dishImg(it, '', 120) || esc(initial(it.name))}</div>
            <div class="nm"><b>${esc(it.name)}${size ? ` <span class="sz">${esc(size)}</span>` : ''}</b><small>${money(price)} each</small></div>
            <div class="stepper"><button data-dec="${esc(key)}" aria-label="One less">${ic('minus', 15)}</button><span>${n}</span><button data-add="${esc(key)}" aria-label="One more">${ic('plus', 15)}</button></div>
          </div>`).join('')}
        ${totalsHtml(false)}
        <p class="muted" style="font-size:14px;margin:4px 0 0">${shop.allowDelivery ? (fee() || form.orderType !== 'delivery' ? `Delivery fee ${Number(shop.deliveryFee) ? money(shop.deliveryFee) : 'is free'}; added at checkout.` : '') : ''}</p>
      </div>
      <div class="dfoot">${isOpen() ? `<button class="bigbtn" data-go="details">Continue to checkout</button>` : `<div class="err">Online ordering is paused right now.</div>`}</div>`
      : `<div class="dbody"><div class="empty">${ic('bag', 44)}<p>Your order is empty. Tap the plus button on any dish to add it.</p></div></div>`);
  }

  if (step === 'details') {
    const types = [shop.allowDelivery && ['delivery', 'Delivery', 'truck'], shop.allowPickup && ['pickup', 'Pickup', 'store']].filter(Boolean);
    d.innerHTML = head('Checkout', 'cart') + `
      <form class="dbody" id="f1" novalidate>
        ${stepsBar(1)}
        ${types.length > 1 ? `<div class="field"><div class="seg" role="radiogroup">${types.map(([k, l, i]) => `<button type="button" role="radio" aria-checked="${form.orderType === k}" class="${form.orderType === k ? 'on' : ''}" data-type="${k}">${ic(i, 17)}${l}</button>`).join('')}</div></div>`
          : types.length ? `<p class="muted" style="margin-top:0">${types[0][0] === 'pickup' ? 'Pickup only: collect your order from the cafe.' : 'Delivery to your address.'}</p>` : ''}
        <div class="field"><label for="fname">Your name</label><input id="fname" name="name" autocomplete="name" maxlength="60" value="${esc(form.name || '')}" required></div>
        <div class="field"><label for="fphone">Phone number</label><input id="fphone" name="phone" type="tel" autocomplete="tel" maxlength="20" inputmode="tel" placeholder="98XXXXXXXX" value="${esc(form.phone || '')}" required></div>
        ${form.orderType === 'delivery' ? `<div class="field"><label>Delivery area</label><div class="areas" role="radiogroup">${areas().map(a => `<button type="button" role="radio" aria-checked="${form.area === a}" class="${form.area === a ? 'on' : ''}" data-area="${esc(a)}">${ic('pin', 15)}${esc(a)}</button>`).join('')}</div><div class="small muted" style="margin-top:6px;font-size:13px">We deliver to these areas in Kawasoti.</div></div>` : ''}
        <div class="field"><label for="faddr">${form.orderType === 'delivery' ? 'House, street or landmark' : 'Your address'}</label><textarea id="faddr" name="address" rows="2" maxlength="300" autocomplete="street-address" placeholder="Area, street, house or landmark" required>${esc(form.address || '')}</textarea></div>
        ${form.orderType === 'pickup' && shop.address ? `<p class="muted">${ic('pin', 16)} Pick up from: ${esc(shop.address)}</p>` : ''}
        <div class="field"><label for="fnote">Note for the kitchen (optional)</label><input id="fnote" name="note" maxlength="300" placeholder="Less spicy, no onion, extra achar" value="${esc(form.note || '')}"></div>
        ${totalsHtml()}
        <div class="err" id="err1"></div>
      </form>
      <div class="dfoot"><button class="bigbtn" id="toPay">Continue to payment</button></div>`;
    d.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { keepForm(); form.orderType = b.dataset.type; renderDrawer(); });
    d.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { keepForm(); form.area = b.dataset.area; renderDrawer(); });
    $('#toPay').onclick = () => {
      keepForm();
      const err = $('#err1');
      if (!form.name) return err.textContent = 'Please enter your name.';
      if (!/^[0-9+ -]{6,20}$/.test(form.phone || '')) return err.textContent = 'Please enter a valid phone number.';
      if (form.orderType === 'delivery' && !areas().includes(form.area)) return err.textContent = 'Please choose your delivery area.';
      if ((form.address || '').length < 3) return err.textContent = form.orderType === 'delivery' ? 'Please enter your house, street or a landmark.' : 'Please enter your address.';
      save(INFO_KEY, { name: form.name, phone: form.phone, address: form.address, area: form.area, orderType: form.orderType });
      step = 'pay'; renderDrawer();
    };
  }

  if (step === 'pay') {
    const total = subtotal() + fee();
    d.innerHTML = head('Checkout', 'details') + `
      <div class="dbody">
        ${stepsBar(2)}
        ${shop.cod ? `<button class="pay ${form.pay === 'cod' ? 'on' : ''}" data-pay="cod" role="radio" aria-checked="${form.pay === 'cod'}">${ic('cash', 20)}<span><b>${form.orderType === 'pickup' ? 'Pay at pickup' : 'Cash on delivery'}</b><small>Pay ${money(total)} when you get your food</small></span></button>` : ''}
        ${shop.payOnline ? `<button class="pay ${form.pay === 'online' ? 'on' : ''}" data-pay="online" role="radio" aria-checked="${form.pay === 'online'}">${ic('phone', 20)}<span><b>Pay online now</b><small>${esc(shop.walletName || 'Mobile wallet')}${shop.walletName ? ', scan the QR or send to our number' : ''}</small></span></button>` : ''}
        ${form.pay === 'online' && shop.payOnline ? `
          <div class="paybox">
            <div class="amount">${money(total)}</div>
            <p class="muted" style="text-align:center;margin:0 0 12px">Send this amount, then place your order.</p>
            ${shop.payQr ? `<img class="qr" id="payqr" alt="Payment QR code">` : ''}
            <dl>
              ${shop.walletName ? `<dt>Pay with</dt><dd>${esc(shop.walletName)}</dd>` : ''}
              ${shop.walletNumber ? `<dt>Number</dt><dd>${esc(shop.walletNumber)}<button class="copy" data-copy="${esc(shop.walletNumber)}">Copy</button></dd>` : ''}
              ${shop.accountName ? `<dt>Name</dt><dd>${esc(shop.accountName)}</dd>` : ''}
            </dl>
            <div class="field" style="margin:0"><label for="fref">Transaction ID from your payment app</label><input id="fref" maxlength="60" placeholder="So we can match your payment" value="${esc(form.ref || '')}"></div>
            <label class="check"><input type="checkbox" id="paid" ${form.paid ? 'checked' : ''}>I have sent ${money(total)}</label>
          </div>` : ''}
        ${totalsHtml()}
        <div class="err" id="err2"></div>
      </div>
      <div class="dfoot"><button class="bigbtn" id="place">${form.pay === 'online' ? 'Place order' : 'Place order'}</button>
        <p class="muted" style="font-size:13px;text-align:center;margin:10px 0 0">Your order goes straight to our kitchen.</p></div>`;
    d.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => { keepPay(); form.pay = b.dataset.pay; renderDrawer(); });
    d.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; } catch { b.textContent = 'Select and copy'; } });
    if ($('#payqr')) db.ref('payqr').once('value').then(s => { const v = s.val(); if (v && $('#payqr')) $('#payqr').src = v; else $('#payqr')?.remove(); }).catch(() => {});
    $('#place').onclick = placeOrder;
  }

  if (step === 'done') {
    const o = myOrders.find(x => x.id === form.lastId);
    d.innerHTML = head('Order sent') + `<div class="dbody">${o ? doneHtml(o) : '<div class="empty">Loading…</div>'}</div>`;
  }

  if (step === 'history') {
    const h = history();
    d.innerHTML = head('My orders') + `<div class="dbody" id="histList">${h.length ? '<div class="empty" style="padding:40px 0">Loading your orders…</div>' : `<div class="empty">${ic('note', 44)}<p>No orders yet from this phone.<br>Your past orders will show up here.</p></div>`}</div>`;
    if (h.length) loadHistory(h);
  }

  if (step.startsWith('track:')) {
    const o = myOrders.find(x => x.id === step.slice(6));
    d.innerHTML = head(o ? 'Order ' + o.code : 'Order') + `<div class="dbody">${o ? doneHtml(o, true) : '<div class="empty">Loading…</div>'}</div>`;
  }

  // shared handlers
  $('#dclose').onclick = closeDrawer;
  d.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); if (step === 'details') keepForm(); if (step === 'pay') keepPay(); step = b.dataset.go; renderDrawer(); });
  d.querySelectorAll('.dbody [data-add], .dbody [data-dec]').forEach(b => b.onclick = () => { changeQty(b.dataset.add || b.dataset.dec, b.dataset.add ? 1 : -1); renderDrawer(); });
  fillPhotos(d);
}
function keepForm() {
  const v = id => ($('#' + id)?.value ?? '').trim();
  if ($('#fname')) form.name = v('fname');
  if ($('#fphone')) form.phone = v('fphone');
  if ($('#faddr')) form.address = v('faddr');
  if ($('#fnote')) form.note = v('fnote');
}
function keepPay() { if ($('#fref')) form.ref = $('#fref').value.trim(); if ($('#paid')) form.paid = $('#paid').checked; }

function waMessage(o) {
  const L = [
    `New order ${o.code} from the ${settings.cafeName} website`,
    `Name: ${o.customer?.name || ''}`,
    `Phone: ${o.customer?.phone || ''}`,
    o.orderType === 'delivery' ? `Deliver to: ${o.customer?.area ? o.customer.area + ', ' : ''}${o.customer?.address || ''}` : `Pickup at the cafe (address: ${o.customer?.address || ''})`,
    '',
    ...o.items.map(l => `${l.qty} x ${lineName(l)} = ${money(l.price * l.qty)}`),
    o.orderType === 'delivery' ? `Delivery: ${o.deliveryFee ? money(o.deliveryFee) : 'Free'}` : '',
    `Total: ${money(o.total)}`,
    `Payment: ${o.payment?.method === 'online' ? `Paid online${shop.walletName ? ' (' + shop.walletName + ')' : ''}${o.payment.ref ? ', transaction ID ' + o.payment.ref : ''}` : (o.orderType === 'pickup' ? 'Pay at pickup' : 'Cash on delivery')}`,
    o.note ? `Note: ${o.note}` : '',
  ].filter((x, i, a) => x !== '' || (a[i - 1] && a[i - 1] !== ''));
  return L.join('\n');
}
// Automatic WhatsApp alert to the cafe's own number (CallMeBot free service; set up in admin > Online shop)
// Phone alerts for the cafe: ntfy app, Telegram and/or WhatsApp (whichever the admin set up)
function sendAlerts(o) {
  const ka = { mode: 'no-cors', keepalive: true };
  try {
    if (shop.ntfyTopic) {
      // short message without personal details (ntfy codes are not password protected)
      const where = o.orderType === 'delivery' ? `Delivery to ${o.customer?.area || 'area not set'}` : 'Pickup';
      const body = `${o.items.map(l => `${l.qty} x ${lineName(l)}`).join(', ')}\n${where}. Total ${money(o.total)}, ${o.payment?.method === 'online' ? 'paid online' : 'cash'}.`;
      const q = `title=${encodeURIComponent(`New online order ${o.code}: ${money(o.total)}`)}&priority=high&tags=bell${shop.adminUrl ? '&click=' + encodeURIComponent(shop.adminUrl) : ''}`;
      fetch(`https://ntfy.sh/${encodeURIComponent(shop.ntfyTopic)}?${q}`, { method: 'POST', body, ...ka }).catch(() => {});
    }
    if (shop.tgToken && shop.tgChat) {
      fetch(`https://api.telegram.org/bot${shop.tgToken}/sendMessage?chat_id=${encodeURIComponent(shop.tgChat)}&text=${encodeURIComponent(waMessage(o))}`, ka).catch(() => {});
    }
  } catch {}
  sendWhatsAppAlert(o);
}
function sendWhatsAppAlert(o) {
  if (!shop.whatsapp || !shop.alertKey) return;
  const url = `https://api.callmebot.com/whatsapp.php?phone=%2B${waStart(shop.whatsapp)}&apikey=${encodeURIComponent(shop.alertKey)}&text=${encodeURIComponent(waMessage(o))}`;
  try { fetch(url, { mode: 'no-cors', keepalive: true }).catch(() => {}); } catch { new Image().src = url; }
}

async function placeOrder() {
  keepPay();
  const err = $('#err2'), btn = $('#place');
  if (!form.pay || (form.pay === 'cod' && !shop.cod) || (form.pay === 'online' && !shop.payOnline)) return err.textContent = 'Please choose how you want to pay.';
  if (form.pay === 'online' && !form.paid) return err.textContent = 'Please send the payment first, then tick the box.';
  const lines = cartLines(items, cart).map(l => orderLine(l, l.n));
  if (!lines.length) return err.textContent = 'Your order is empty.';
  btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
  const id = db.ref('orders').push().key;
  const order = {
    table: 'Online', items: lines, note: (form.note || '').slice(0, 300), status: 'new', source: 'online',
    orderType: form.orderType, deliveryFee: fee(),
    customer: { name: form.name, phone: form.phone, address: form.address || '', ...(form.orderType === 'delivery' ? { area: form.area } : {}) },
    payment: { method: form.pay, ref: form.pay === 'online' ? (form.ref || '') : '', verified: false },
    createdAt: TS(), updatedAt: TS(), createdBy: '', createdByName: '', handledBy: '',
  };
  let lastErr;
  for (let attempt = 0; attempt < 6; attempt++) { // another customer may have ordered in the same 3 seconds
    try {
      await db.ref().update({ ['orders/' + id]: order, 'meta/onlineLastOrderAt': TS() });
      lastErr = null; break;
    } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 1200 + Math.random() * 800)); }
  }
  if (lastErr) {
    btn.disabled = false; btn.textContent = 'Place order';
    return err.textContent = isOpen() ? 'The order could not be sent. A price may have just changed or a dish sold out. Check your order and try again.' : 'Online ordering was just paused. Please try again later.';
  }
  const local = normOrder({ id, ...order, createdAt: Date.now(), updatedAt: Date.now() });
  myOrders = [local, ...myOrders.filter(x => x.id !== id)];
  addHistory(id);
  watchOrder(id);
  sendAlerts(local);
  cart = {}; save(CART_KEY, cart);
  form.ref = ''; form.paid = false; form.note = ''; form.lastId = id;
  renderMenu(); renderCartBits();
  step = 'done'; renderDrawer();
}

function doneHtml(o, tracking) {
  const lvl = { new: 1, processing: 2, ready: 3, delivered: 4 }[o.status] || 0;
  const third = o.orderType === 'pickup' ? 'Ready' : 'On the way';
  const st = (n, label) => `<div class="${lvl >= n ? 'on' : ''}"><i>${lvl >= n ? ic('check', 14) : n}</i>${label}</div>`;
  return `<div class="done">
    ${tracking ? '' : `<div class="big">${ic('check', 38)}</div><h3>Order sent</h3>
    <p>Order ${esc(o.code)} is with our kitchen. We'll call you on ${esc(o.customer?.phone || 'your phone')} if we need anything.</p>`}
    ${o.status === 'cancelled' ? `<p class="err">This order was cancelled. Please call us if you have questions.</p>` :
      `<div class="track">${st(1, 'Received')}${st(2, 'Preparing')}${st(3, third)}${st(4, o.orderType === 'pickup' ? 'Picked up' : 'Delivered')}</div>`}
    ${shop.phone ? `<a class="linkbtn" style="display:block;text-decoration:none" href="tel:${esc(shop.phone.replace(/[^0-9+]/g, ''))}">${ic('call', 16)} Call ${esc(shop.phone)}</a>` : ''}
    <div class="summary">${o.items.map(l => `${l.qty} x ${esc(lineName(l))}`).join('<br>')}
      <div style="margin-top:8px;font-weight:700">Total ${money(o.total)}, ${o.payment?.method === 'online' ? (o.payment.verified ? 'payment received' : 'paid online, being checked') : (o.orderType === 'pickup' ? 'pay at pickup' : 'cash on delivery')}</div></div>
    ${tracking ? '' : `<button class="linkbtn" id="more">Order something else</button>`}
  </div>`;
}
document.addEventListener('click', e => { if (e.target.id === 'more') { closeDrawer(); } });

// ---------- My orders (history on this phone) ----------
const statusLabel = o => ({ new: 'Received', processing: 'Preparing', ready: o.orderType === 'pickup' ? 'Ready for pickup' : 'On the way', delivered: o.orderType === 'pickup' ? 'Picked up' : 'Delivered', cancelled: 'Cancelled' }[o.status] || o.status);
async function loadHistory(h) {
  const got = await Promise.all(h.slice(0, 30).map(x => db.ref('orders/' + x.id).once('value').then(sn => sn.val() ? normOrder({ id: x.id, ...sn.val() }) : null).catch(() => null)));
  const list = got.filter(Boolean).sort((a, b) => b.createdAt - a.createdAt);
  const el = $('#histList'); if (!el || step !== 'history') return;
  if (!list.length) { el.innerHTML = `<div class="empty">${ic('note', 44)}<p>No orders found.</p></div>`; return; }
  const fmt = t => new Date(t).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  el.innerHTML = `<p class="muted" style="margin:0 0 12px;font-size:14px">Orders placed from this phone.</p>` + list.map(o => `
    <div class="hist">
      <div class="top"><b>Order ${esc(o.code)}</b><span class="chip ${esc(o.status)}">${esc(statusLabel(o))}</span></div>
      <div class="when">${fmt(o.createdAt)}, ${o.orderType === 'pickup' ? 'pickup' : 'delivery'}</div>
      <div class="its">${o.items.map(l => `${l.qty} x ${esc(lineName(l))}`).join('<br>')}</div>
      <div class="row2"><b>${money(o.total)}</b>
        <div class="acts">
          ${['new', 'processing', 'ready'].includes(o.status) ? `<button class="smallbtn" data-track="${esc(o.id)}">${ic('truck', 15)}Track</button>` : ''}
          <button class="smallbtn red" data-again="${esc(o.id)}">${ic('bag', 15)}Order again</button>
        </div></div>
    </div>`).join('');
  el.onclick = e => {
    const t = e.target.closest('[data-track]'), a = e.target.closest('[data-again]');
    if (t) { watchOrder(t.dataset.track); step = 'track:' + t.dataset.track; renderDrawer(); }
    if (a) orderAgain(list.find(o => o.id === a.dataset.again));
  };
}
function orderAgain(o) {
  if (!o) return;
  if (!isOpen()) return toast('Online ordering is paused right now.', 'alert');
  let added = 0, missing = 0;
  for (const l of o.items) {
    const k = cartKey(l.id, l.opt);
    if (cartPick(items, k)) { cart[k] = Math.min(50, (cart[k] || 0) + l.qty); added++; } else missing++;
  }
  save(CART_KEY, cart); renderMenu(); renderCartBits();
  if (!added) return toast('Those dishes are not available right now.', 'alert');
  toast(missing ? 'Added to your order. Some dishes are not available right now.' : 'Added to your order.', missing ? 'alert' : '');
  step = 'cart'; renderDrawer();
}

// ---------- your recent orders (live) ----------
function watchOrder(id) {
  if (watching[id]) return;
  watching[id] = true;
  db.ref('orders/' + id).on('value', snap => {
    const v = snap.val();
    if (!v || Date.now() - (v.createdAt || 0) > 2 * 86400e3) {
      db.ref('orders/' + id).off(); delete watching[id];
      myOrders = myOrders.filter(o => o.id !== id); save(KEY, Object.keys(watching)); renderMine(); return;
    }
    const o = normOrder({ id, ...v }), old = myOrders.find(x => x.id === id);
    if (old && old.status !== o.status) {
      const msg = { processing: 'is being prepared', ready: o.orderType === 'pickup' ? 'is ready for pickup' : 'is on the way', delivered: o.orderType === 'pickup' ? 'was picked up. Enjoy!' : 'was delivered. Enjoy!', cancelled: 'was cancelled' }[o.status];
      if (msg) toast(`Your order ${o.code} ${msg}`, o.status === 'cancelled' ? 'alert' : '');
    }
    myOrders = [o, ...myOrders.filter(x => x.id !== id)].sort((a, b) => b.createdAt - a.createdAt);
    save(KEY, Object.keys(watching));
    renderMine();
    if ($('#drawer')?.classList.contains('open') && (step === 'done' || step === 'track:' + id)) renderDrawer();
  }, () => { delete watching[id]; save(KEY, Object.keys(watching)); });
  save(KEY, Object.keys(watching));
}
function renderMine() {
  const el = $('#mine'); if (!el) return;
  const label = o => ({ new: 'Received', processing: 'Preparing', ready: o.orderType === 'pickup' ? 'Ready for pickup' : 'On the way', delivered: o.orderType === 'pickup' ? 'Picked up' : 'Delivered', cancelled: 'Cancelled' }[o.status] || o.status);
  el.innerHTML = myOrders.map(o => `<button data-track="${esc(o.id)}"><span class="dotst ${esc(o.status)}"></span><span>Your order <b>${esc(o.code)}</b><br><small class="muted">${esc(label(o))}</small></span></button>`).join('');
  el.style.display = myOrders.length ? '' : 'none';
  el.onclick = e => { const b = e.target.closest('[data-track]'); if (b) openDrawer('track:' + b.dataset.track); };
}

init().catch(e => { $('#app').innerHTML = `<div class="empty"><h2>The menu could not load</h2><p>${esc(friendly(e))}</p></div>`; });
</script>
<script>
/* If a file didn't upload, say exactly which one instead of loading forever */
(function () {
  var miss = (window.__ckMissing || []).slice();
  if (typeof window.CK_FIREBASE === 'undefined') miss.push('config.js');
  if (typeof firebase === 'undefined') miss.push('firebase-app-compat.js');
  if (typeof CONFIGURED === 'undefined') miss.push('common.js');
  if (typeof CONFIGURED !== 'undefined' && window.CK_VERSION !== '20261031043856') miss.push('common.js (this one is from an older version, upload the new common.js)');
  miss = miss.filter(function (v, i, a) { return a.indexOf(v) === i; });
